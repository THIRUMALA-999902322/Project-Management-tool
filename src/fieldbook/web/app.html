<div class="shell">
  <aside class="side" id="side" aria-label="Main navigation">
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="3" width="22" height="26" rx="3.5" fill="#F2C230"/><rect x="20.5" y="3" width="2.8" height="26" fill="#14213D"/><path d="M9.5 10.5h8M9.5 15h8M9.5 19.5h5" stroke="#14213D" stroke-width="1.9" stroke-linecap="round"/></svg>
      <span><b>Fieldbook</b><small id="orgName">&nbsp;</small></span>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#/" data-nav="overview"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg>Overview</a>
      <a href="#/inbox" data-nav="inbox"><svg class="ic" aria-hidden="true"><use href="#i-inbox"/></svg>Approvals<span class="badge" id="navInbox" hidden></span></a>
      <a href="#/projects" data-nav="projects"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg>Projects</a>
      <a href="#/jobs" data-nav="jobs"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg>Jobs</a>
      <a href="#/people" data-nav="people"><svg class="ic" aria-hidden="true"><use href="#i-users"/></svg>People</a>
      <div class="nav-label">Assistant</div>
      <a href="#/ask" data-nav="ask"><svg class="ic" aria-hidden="true"><use href="#i-spark"/></svg>Ask about the work</a>
    </nav>
    <div class="side-foot">
      <div class="engine" id="engine"></div>
      <div class="me" id="meBlock"></div>
    </div>
  </aside>
  <div class="side-scrim" id="sideScrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="iconbtn menu-btn" id="menuBtn" aria-label="Open navigation" aria-controls="side" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div class="top-actions">
        <span class="live" id="live" title="Live updates"><span class="dot"></span><span>Live</span></span>
        <button class="btn btn-secondary btn-sm" data-act="add-person" aria-label="Add person"><svg class="ic" aria-hidden="true"><use href="#i-user-plus"/></svg><span class="lbl">Add person</span></button>
        <button class="btn btn-primary btn-sm" data-act="new-project" aria-label="New project"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span class="lbl">New project</span></button>
      </div>
    </header>
    <main class="page" id="view" tabindex="-1"><p class="loading">Loading…</p></main>
  </div>
</div>

<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>

</html>
