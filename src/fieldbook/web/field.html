<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Fieldbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/office.css">
<link rel="stylesheet" href="/static/field.css">
</head>
<body class="fieldapp">
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4-4L6 21"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></symbol>
  <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m21.4 11-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.6a10 10 0 0 1 5.2-2.6M19 12.6a10 10 0 0 0-2.3-1.6M2 8.8a15 15 0 0 1 4.2-2.7M10.7 5a15 15 0 0 1 11.3 3.8M12 20h.01"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-asst" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.5" fill="none" stroke="#14213D" stroke-width="2"/><path d="M15.5 3.5v17" stroke="#14213D" stroke-width="2.4"/><path d="M8.5 9h4M8.5 12.5h4" stroke="#14213D" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

<header class="fbar">
  <div class="fbar__in">
    <svg class="fbar__mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="3" width="22" height="26" rx="3.5" fill="#F2C230" stroke="#14213D" stroke-width="2"/><rect x="20.5" y="3" width="2.8" height="26" fill="#14213D"/><path d="M9.5 10.5h8M9.5 15h8M9.5 19.5h5" stroke="#14213D" stroke-width="1.9" stroke-linecap="round"/></svg>
    <div class="fbar__who"><b id="hello">Fieldbook</b><span id="sub">Your Assistant</span></div>
  </div>
  <div class="offline" id="offline" hidden><svg class="ic" aria-hidden="true"><use href="#i-wifi-off"/></svg><span id="offlineText">Offline</span></div>
</header>

<main class="fmain" id="main">
  <section class="jobhead" id="jobhead" aria-label="Job"></section>
  <section class="draft" id="draft" aria-label="Today's draft"></section>
  <ol class="thread" id="thread" aria-label="Messages" aria-live="polite"></ol>
</main>

<form class="composer2" id="composer" autocomplete="off">
  <input type="file" id="pickPhoto" accept="image/*" capture="environment" multiple class="vh">
  <input type="file" id="pickFile" accept=".pdf,.doc,.docx,.xls,.xlsx,image/*" multiple class="vh">
  <label class="cbtn" for="pickFile" aria-label="Attach a file"><svg class="ic" aria-hidden="true"><use href="#i-paperclip"/></svg></label>
  <label class="cbtn" for="pickPhoto" aria-label="Take or add photos"><svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg></label>
  <button type="button" class="cbtn" id="mic" aria-label="Record a voice note"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg></button>
  <input id="text" class="ctext" placeholder="Tell me what you did" aria-label="Message">
  <button class="cbtn cbtn--send" type="submit" aria-label="Send"><svg class="ic" aria-hidden="true"><use href="#i-send"/></svg></button>
</form>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/static/field.js"></script>
</body>
</html>
