[project]
name = "fieldbook"
version = "0.1.0"
description = "Fieldbook: AI-assisted work tracking for civil projects (MVP backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "pypdf>=5.1",
    "httpx>=0.28",
]

[project.scripts]
fieldbook = "fieldbook.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # the formatter owns line length; prompt prose stays unwrapped
